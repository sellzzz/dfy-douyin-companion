<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';media-src 'self' blob:;connect-src 'none'"><title>DouPet 窗口陪看</title>
<style>body{margin:0;padding:26px;background:#f4f7fb;color:#182d44;font:15px 'Microsoft YaHei',sans-serif}h1{margin:0 0 9px;font-size:26px}p{color:#53677b;line-height:1.7}button,select{font:inherit;padding:10px 14px;border:1px solid #c6d2df;border-radius:9px;background:white}button{cursor:pointer}button.primary{background:#176b98;color:white;border-color:#176b98}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}select{flex:1;min-width:250px}#stage{position:relative;width:100%;background:#152237;border-radius:12px;overflow:hidden;min-height:250px}video{width:100%;display:block;max-height:410px;object-fit:contain}#crop{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}#status{padding:12px;background:#e4eff7;border-radius:9px;line-height:1.6}#response{min-height:28px;font-size:19px;line-height:1.7}small{color:#607487}</style>
<h1>陪你一起看</h1><p>在抖音 Windows 客户端或 Chrome/Edge 中播放抖音，选择对应窗口，再框选视频画面。<br>画面只交给本机模型处理，不保存画面；暂不读取声音。</p>
<div class="row"><select id="windows" aria-label="抖音窗口"></select><button id="refresh">刷新窗口</button><button id="preview" class="primary">预览所选窗口</button></div>
<div id="stage"><video id="video" muted autoplay playsinline></video><canvas id="crop" aria-label="拖动框选视频区域"></canvas></div>
<div class="row"><button id="start" class="primary" disabled>开始陪看</button><button id="pause" disabled>暂停陪看</button><button id="stop">结束采集</button></div>
<div id="status" role="status">尚未采集。请先选择窗口。</div><p id="response"></p><small>最小化视频窗口可能无法获取新画面。关闭此窗口会停止采集。</small><script src="geometry.cjs"></script><script src="renderer.js"></script></html>
