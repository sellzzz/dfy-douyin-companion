<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'"><title>确认陪看范围</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font:14px 'Microsoft YaHei',sans-serif;user-select:none}#box{position:absolute;box-sizing:border-box;border:3px solid #36dfaa;border-radius:5px;cursor:move;box-shadow:0 0 0 9999px #071a2845}#toolbar{position:absolute;display:flex;gap:7px;align-items:center;padding:9px;border-radius:10px;background:#122c40;color:white;white-space:nowrap;box-shadow:0 4px 18px #0005}button{padding:7px 10px;border:0;border-radius:7px;cursor:pointer;font:inherit}#confirm{background:#36dfaa;color:#08291e;font-weight:bold}.handle{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #1aa980;box-sizing:border-box}.handle[data-edge=nw]{left:-8px;top:-8px;cursor:nwse-resize}.handle[data-edge=ne]{right:-8px;top:-8px;cursor:nesw-resize}.handle[data-edge=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}.handle[data-edge=se]{right:-8px;bottom:-8px;cursor:nwse-resize}.handle[data-edge=n]{left:50%;top:-8px;cursor:ns-resize}.handle[data-edge=s]{left:50%;bottom:-8px;cursor:ns-resize}.handle[data-edge=w]{left:-8px;top:50%;cursor:ew-resize}.handle[data-edge=e]{right:-8px;top:50%;cursor:ew-resize}body.confirmed #toolbar,body.confirmed .handle{display:none}body.confirmed #box{box-shadow:none;border-width:2px;opacity:.75;cursor:default}#note{max-width:300px;font-size:12px}</style>
<div id="box" aria-label="陪看范围"><i class="handle" data-edge="nw"></i><i class="handle" data-edge="ne"></i><i class="handle" data-edge="sw"></i><i class="handle" data-edge="se"></i><i class="handle" data-edge="n"></i><i class="handle" data-edge="s"></i><i class="handle" data-edge="w"></i><i class="handle" data-edge="e"></i></div>
<div id="toolbar"><span id="note">拖动边框调整范围，确认后宠物在框里活动。</span><button id="confirm">确认陪看</button><button id="redraw">重新画框</button><button id="cancel">取消</button></div>
<script src="geometry.cjs"></script><script src="region-editor.js"></script></html>
